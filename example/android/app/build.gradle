apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

File canonicalOrOriginal(File target) {
    try {
        return target.canonicalFile
    } catch (IOException ignored) {
        return target
    }
}

File resolveFromNodeModules(String relativePath) {
    List<File> searchRoots = [
        file("../../node_modules"),
        file("../../../node_modules"),
    ]

    for (File root : searchRoots) {
        if (!root.exists()) {
            continue
        }
        File direct = new File(root, relativePath)
        if (direct.exists()) {
            return canonicalOrOriginal(direct)
        }
        File hoisted = new File(root, ".pnpm/node_modules/${relativePath}")
        if (hoisted.exists()) {
            return canonicalOrOriginal(hoisted)
        }
    }
    return null
}

File requireFromNodeModules(String relativePath) {
    File resolved = resolveFromNodeModules(relativePath)
    if (resolved == null || !resolved.exists()) {
        throw new GradleException(
            "Could not find ${relativePath}. Run `pnpm install` from the workspace root."
        )
    }
    return resolved
}

react {
    def resolvedCodegenDir = requireFromNodeModules("@react-native/codegen")
    if (!resolvedCodegenDir.isDirectory()) {
        throw new GradleException("Expected @react-native/codegen directory: ${resolvedCodegenDir}")
    }
    codegenDir = resolvedCodegenDir
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.example.reactnativenativevideo"
    defaultConfig {
        applicationId "com.example.reactnativenativevideo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

File nativeModulesGradle = requireFromNodeModules(
    "@react-native-community/cli-platform-android/native_modules.gradle"
)
apply from: nativeModulesGradle
applyNativeModulesAppBuildGradle(project)
