import com.android.Version
import java.nio.file.Paths

static def findNodeModules(File baseDir) {
  def basePath = baseDir.toPath().normalize()
  while (basePath != null) {
    def nodeModulesPath = Paths.get(basePath.toString(), "node_modules")
    def reactNativePath = Paths.get(nodeModulesPath.toString(), "react-native")
    if (reactNativePath.toFile().exists()) {
      return nodeModulesPath.toFile()
    }
    basePath = basePath.getParent()
  }
  throw new GradleException(
      "ReactNativeNativeVideo: unable to find react-native in a parent node_modules directory")
}

// Resolve React Native from the consuming app. The in-repo example owns an RN
// 0.73 install while the library root intentionally owns RN 0.83 for modern
// codegen validation.
def nodeModules = findNodeModules(rootProject.projectDir)
def reactNativeDir = new File(nodeModules, "react-native")
def reactProperties = new Properties()
file("${reactNativeDir}/ReactAndroid/gradle.properties").withInputStream {
  reactProperties.load(it)
}
def reactNativeVersion = reactProperties.getProperty("VERSION_NAME")
def reactNativeMinor = reactNativeVersion.startsWith("0.0.0-")
    ? 1000
    : reactNativeVersion.split("\\.")[1].toInteger()
if (reactNativeMinor < 73) {
  throw new GradleException(
      "ReactNativeNativeVideo requires React Native 0.73 or newer; found ${reactNativeVersion}")
}

static def supportsNamespace() {
  def parsed = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()
  return major > 7 || (major == 7 && minor >= 3)
}

def safeExtGet(String property, Object fallback) {
  return rootProject.ext.has(property) ? rootProject.ext.get(property) : fallback
}

def nativeVideoExtGet(String property, Object fallback) {
  def prefixed = "NativeVideo_${property}"
  return rootProject.ext.has(prefixed)
      ? rootProject.ext.get(prefixed)
      : safeExtGet(property, fallback)
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

buildscript {
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
    }
    dependencies {
      classpath "com.android.tools.build:gradle:8.12.0"
      classpath "com.facebook.react:react-native-gradle-plugin"
    }
  }
}

apply plugin: "com.android.library"

// RN 0.82+ is New-Architecture-only. RN 0.73-0.81 hosts select the architecture
// explicitly, which leaves the RN 0.73 example on the legacy source set.
def newArchitecture = reactNativeMinor >= 82 ||
    (rootProject.hasProperty("newArchEnabled") &&
        rootProject.getProperty("newArchEnabled") == "true")
def minNewArchMinor = 75
if (newArchitecture && reactNativeMinor < minNewArchMinor) {
  throw new GradleException(
      "ReactNativeNativeVideo New Architecture support requires React Native 0.${minNewArchMinor}+; " +
      "found ${reactNativeVersion}. Set newArchEnabled=false for this host.")
}

apply plugin: "com.facebook.react"

def javaCompatibility = reactNativeMinor >= 73
    ? JavaVersion.VERSION_17
    : JavaVersion.VERSION_1_8

android {
  if (supportsNamespace()) {
    namespace "com.reactnativenativevideo"
  }

  compileSdkVersion nativeVideoExtGet("compileSdkVersion", newArchitecture ? 36 : 34)
  ndkVersion nativeVideoExtGet("ndkVersion", newArchitecture ? "27.1.12297006" : "25.1.8937393")

  defaultConfig {
    minSdkVersion nativeVideoExtGet("minSdkVersion", newArchitecture ? 24 : 21)
    targetSdkVersion nativeVideoExtGet("targetSdkVersion", newArchitecture ? 36 : 34)

    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17 -frtti -fexceptions -Wall -Wextra"
        arguments "-DANDROID_STL=c++_shared",
            "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
            "-DNODE_MODULES_DIR=${nodeModules.absolutePath}",
            "-DREACT_NATIVE_MINOR_VERSION=${reactNativeMinor}",
            "-DRNNATIVEVIDEO_NEW_ARCH=${newArchitecture ? 1 : 0}"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  sourceSets {
    main {
      if (newArchitecture) {
        java.srcDirs += ["src/newarch/java"]
      } else {
        java.srcDirs += ["src/oldarch/java"]
        manifest.srcFile "src/oldarch/AndroidManifest.xml"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  // ReactAndroid/fbjni are supplied by the consuming app. AGP otherwise copies
  // the imported Prefab libraries into this AAR as if they belonged to us,
  // producing duplicate libjsi/libreactnativejni entries on RN 0.73.
  packagingOptions {
    excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libjsi.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
    ]
  }

  buildTypes {
    debug {
      externalNativeBuild.cmake.cppFlags "-O1 -g"
    }
    release {
      minifyEnabled false
      externalNativeBuild.cmake.cppFlags "-O2"
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility javaCompatibility
    targetCompatibility javaCompatibility
  }
}

react {
  libraryName = "RNNativeVideoSpec"
  jsRootDir = file("..")
  reactNativeDir = new File(nodeModules, "react-native")
  codegenDir = new File(nodeModules, "@react-native/codegen")
  codegenJavaPackageName = "com.reactnativenativevideo"
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android:${reactNativeVersion}"
}
